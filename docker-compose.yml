version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 15 Database Service
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: plane_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plane_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plane_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plane_network

  # ============================================================================
  # 2. FastAPI Backend Engine Service
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plane_api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-plane_db}
      - SECRET_KEY=${SECRET_KEY:-super-secret-jwt-key-for-plane-ota-development-change-in-prod}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-pk.eyJ1IjoicGxhbmUtdHJhdmVsIiwiYSI6ImNsdGVzdHRva2VuIn0.demo}
      - PLATFORM_FEE_PERCENTAGE=${PLATFORM_FEE_PERCENTAGE:-5.0}
      - DEFAULT_TAX_PERCENTAGE=${DEFAULT_TAX_PERCENTAGE:-8.5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - plane_network

  # ============================================================================
  # 3. Nginx Reverse Proxy & Web Portals (Vendor & Admin)
  # ============================================================================
  web:
    image: nginx:alpine
    container_name: plane_web_proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web_portal/vendor:/usr/share/nginx/html/vendor:ro
      - ./web_portal/admin:/usr/share/nginx/html/admin:ro
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plane_network

networks:
  plane_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
